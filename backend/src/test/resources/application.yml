spring:
  datasource:
    url: jdbc:h2:mem:settlehub-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

settlehub:
  jwt:
    secret: settlehub-test-secret-key-must-be-long-enough-123456
    expiration-seconds: 3600
  seed:
    enabled: true
  payout:
    provider: mock

