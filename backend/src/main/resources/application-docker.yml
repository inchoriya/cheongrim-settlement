spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:settlehub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:settlehub}
    password: ${MYSQL_PASSWORD:settlehub}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

settlehub:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  seed:
    enabled: ${SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}
  payout:
    provider: ${PAYOUT_PROVIDER:mock}
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
      security-key: ${TOSS_SECURITY_KEY:}
      base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
      schedule-type: ${TOSS_SCHEDULE_TYPE:SCHEDULED}
      payout-date: ${TOSS_PAYOUT_DATE:}

logging:
  level:
    com.settlehub: INFO
