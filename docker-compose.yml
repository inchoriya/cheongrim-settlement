services:
  mysql:
    image: mysql:8.4
    container_name: settlehub-mysql
    environment:
      MYSQL_DATABASE: settlehub
      MYSQL_USER: settlehub
      MYSQL_PASSWORD: settlehub
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: settlehub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: settlehub-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: settlehub
      MYSQL_USER: settlehub
      MYSQL_PASSWORD: settlehub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: settlehub-docker-dev-secret-key-change-me-32b
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: settlehub-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql_data:
