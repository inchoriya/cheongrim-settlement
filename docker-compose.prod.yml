# 프로덕션/EC2용 Compose
# 사용: docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# - MySQL/Redis 포트는 호스트에 노출하지 않음 (컨테이너 네트워크만)
# - web:80 만 공개 권장 (보안그룹)

services:
  mysql:
    image: mysql:8.4
    container_name: settlehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-settlehub}
      MYSQL_USER: ${MYSQL_USER:-settlehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - settlehub

  redis:
    image: redis:7-alpine
    container_name: settlehub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - settlehub

  api:
    build:
      context: ./backend
    container_name: settlehub-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-settlehub}
      MYSQL_USER: ${MYSQL_USER:-settlehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-mock}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_SECURITY_KEY: ${TOSS_SECURITY_KEY:-}
      TOSS_BASE_URL: ${TOSS_BASE_URL:-https://api.tosspayments.com}
      TOSS_SCHEDULE_TYPE: ${TOSS_SCHEDULE_TYPE:-SCHEDULED}
      TOSS_PAYOUT_DATE: ${TOSS_PAYOUT_DATE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 50s
    networks:
      - settlehub

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: settlehub-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - settlehub

volumes:
  mysql_data:
  redis_data:

networks:
  settlehub:
    driver: bridge
