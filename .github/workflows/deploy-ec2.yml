name: Deploy EC2

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: "Optional note for this deploy"
        required: false
        default: "manual deploy"

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for script visibility only)
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            cd "$APP_DIR"
            git fetch --all
            git pull --ff-only
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
            echo "Deploy finished: ${{ github.sha }} (${{ inputs.ref_note }})"
